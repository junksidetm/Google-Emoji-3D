name: Build and Release Google Emoji 3D TTF

on:
  schedule:
    # Autonomous check for new Google 3D PNG assets every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force font compilation and bump tag even if no new upstream commits found'
        required: false
        type: boolean
        default: false
      resolution:
        description: 'Bitmap strike resolution (px)'
        required: false
        type: choice
        options:
          - '128'
          - '160'
          - '72'
          - '32'
        default: '128'
      concurrency:
        description: 'Parallel download concurrency'
        required: false
        type: number
        default: 50
      tag_name:
        description: 'Specific release tag override (e.g. v1.1.2, leave empty for auto-bump)'
        required: false
        type: string
        default: ''
  repository_dispatch:
    types: [new-pngs, sync-emojis, release]

jobs:
  build-and-release:
    name: Build 3D Emoji TTF Font
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Upstream Google 3D Updates
        id: upstream_check
        env:
          FORCE_BUILD: ${{ inputs.force_build || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') }}
          INPUT_TAG_NAME: ${{ inputs.tag_name || '' }}
        run: |
          python scripts/check_upstream_updates.py

      - name: Cache downloaded 3D PNG assets
        if: steps.upstream_check.outputs.has_update == 'true'
        uses: actions/cache@v4
        id: png-cache
        with:
          path: output/png
          key: noto-3d-pngs-${{ inputs.resolution || '128' }}px-${{ github.run_id }}
          restore-keys: |
            noto-3d-pngs-${{ inputs.resolution || '128' }}px-
            noto-3d-pngs-

      - name: Fetch and Categorize Metadata
        if: steps.upstream_check.outputs.has_update == 'true'
        run: |
          python scripts/fetch_metadata.py

      - name: Parallel Download 3D PNG Assets
        if: steps.upstream_check.outputs.has_update == 'true'
        run: |
          python scripts/download_assets.py \
            --resolution ${{ inputs.resolution || '128' }} \
            --concurrency ${{ inputs.concurrency || '50' }}

      - name: Compile Google Emoji 3D TTF Font
        if: steps.upstream_check.outputs.has_update == 'true'
        run: |
          python scripts/build_font.py

      - name: Verify Font Integrity
        if: steps.upstream_check.outputs.has_update == 'true'
        run: |
          python scripts/verify_font.py build/GoogleEmoji3D.ttf

      - name: Test Emoji Font & OpenType Standards Conformance
        if: steps.upstream_check.outputs.has_update == 'true'
        run: |
          python scripts/test_emoji_font.py build/GoogleEmoji3D.ttf --base data/NotoColorEmoji.base.ttf

      - name: Package Release Assets
        if: steps.upstream_check.outputs.has_update == 'true'
        shell: pwsh
        run: |
          $res = "${{ inputs.resolution || '128' }}"
          $archiveName = "GoogleEmoji3D-${res}px.zip"
          
          Compress-Archive -Path "build/GoogleEmoji3D.ttf", "data/categories_manifest.json", "data/emojis_metadata.json", "README.md" -DestinationPath "build/$archiveName" -Force
          Write-Host "Created release archive: build/$archiveName"
          
          $sizeMb = (Get-Item "build/GoogleEmoji3D.ttf").Length / 1MB
          "FONT_SIZE_MB=$([math]::Round($sizeMb, 2))" >> $env:GITHUB_ENV
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload Build Artifacts
        if: steps.upstream_check.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GoogleEmoji3D-${{ inputs.resolution || '128' }}px
          path: |
            build/GoogleEmoji3D.ttf
            build/*.zip
            data/categories_manifest.json

      - name: Commit & Tag New Release Version
        if: steps.upstream_check.outputs.has_update == 'true'
        env:
          NEW_TAG: ${{ steps.upstream_check.outputs.new_tag }}
          NEW_VERSION: ${{ steps.upstream_check.outputs.new_version }}
        run: |
          git config --local user.name "junksidetm"
          git config --local user.email "331540275+junksidetm@users.noreply.github.com"
          git add VERSION Version.md .upstream_state.json data/categories_manifest.json data/emojis_metadata.json
          git commit -m "release: $NEW_TAG - autonomous Google 3D emoji sync [skip ci]" || echo "No changes to commit"
          git tag -a "$NEW_TAG" -m "Google Emoji 3D $NEW_TAG release"
          git push origin main --tags

      - name: Publish New GitHub Release
        if: steps.upstream_check.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream_check.outputs.new_tag }}
          name: Google Emoji 3D (${{ steps.upstream_check.outputs.new_tag }})
          body: |
            ## 🎨 Google Emoji 3D (Android 17 Volumetric Style) - ${{ steps.upstream_check.outputs.new_tag }}

            TrueType (`.ttf`) color emoji font compiled autonomously from Google's official 3D Noto Emoji assets.
            Autonomously compiled when Google updated upstream 3D PNG assets (`googlefonts/noto-emoji`).

            ### 📦 Release Details
            - **Font File:** `GoogleEmoji3D.ttf` (${{ env.FONT_SIZE_MB }} MB)
            - **Format:** OpenType / TrueType native Android `CBDT`/`CBLC` color bitmap strikes with exact Format 17 136x128 metrics, `cmap` Format 12, and `GSUB` sequence ligatures.
            - **Base Font:** Official Google Android `NotoColorEmoji.ttf` (Unicode 17.0, v2.051) with native OpenType tables, patched with Google 3D volumetric assets.
            - **Compatible with:** Instafel, Gboard (via Custom Emoji Font in [mrdarksidetm/Gboard-patches](https://github.com/mrdarksidetm/Gboard-patches)), WhatsApp, Android system font managers, and Linux/FreeType apps.

            ### 📁 Included Assets
            - `GoogleEmoji3D.ttf`: Standalone emoji font file ready to bundle in Instafel or install on system.
            - `GoogleEmoji3D-128px.zip`: Complete archive with manifests and documentation.
            - `categories_manifest.json`: Full categorized taxonomy matching Google Fonts Emoji.
            - `emojis_metadata.json`: Comprehensive Unicode proposal and CLDR metadata.

            ### 🚀 Installation in Instafel & Gboard
            - **Instafel:** Long-press Home button -> Typography & Emojis -> Enable Custom Emojis -> Select Google 3D Emojis.
            - **Gboard:** Open Gboard Settings > Gboard Patches > Custom Emoji Font (.ttf) > Choose `GoogleEmoji3D.ttf`.
          files: |
            build/GoogleEmoji3D.ttf
            build/${{ env.ARCHIVE_NAME }}
            data/categories_manifest.json
            data/emojis_metadata.json
          make_latest: true
